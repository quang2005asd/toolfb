# ========================================================
# Chạy trên VPS cho người dùng thật: HTTPS tự động (Caddy + Let's Encrypt)
#   1. cp .env.production.example .env   rồi điền DOMAIN, các khóa bí mật, thông tin liên hệ
#   2. docker compose -f docker-compose.prod.yml up -d --build
# Chỉ mở cổng 80/443 ra Internet; Redis, server, client chỉ nói chuyện trong mạng nội bộ Docker.
# Hướng dẫn đầy đủ: deploy/HUONG-DAN-VPS.md
# ========================================================
name: tool_face

x-app-env: &app-env
  NODE_ENV: production
  PORT: 5000
  USE_SQLITE: "true"
  DB_TYPE: sqlite
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CLIENT_ORIGIN: https://${DOMAIN:?Thiếu DOMAIN trong .env}
  FACEBOOK_REDIRECT_URI: https://${DOMAIN}/api/auth/facebook/callback
  COOKIE_SECURE: "true"
  SESSION_SECRET: ${SESSION_SECRET:?Thiếu SESSION_SECRET trong .env (openssl rand -hex 32)}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Thiếu ADMIN_PASSWORD trong .env (tối thiểu 8 ký tự)}
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v26.0}
  FACEBOOK_LOGIN_SCOPES: ${FACEBOOK_LOGIN_SCOPES:-}
  MESSENGER_SYNC_INTERVAL_SECONDS: ${MESSENGER_SYNC_INTERVAL_SECONDS:-5}
  MESSENGER_VERIFY_TOKEN: ${MESSENGER_VERIFY_TOKEN:?Thiếu MESSENGER_VERIFY_TOKEN trong .env}
  PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-Tool Face}
  PUBLIC_OPERATOR_NAME: ${PUBLIC_OPERATOR_NAME:-}
  PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:?Thiếu PUBLIC_CONTACT_EMAIL (email liên hệ hiện trên trang Chính sách)}
  PUBLIC_POLICY_UPDATED_AT: ${PUBLIC_POLICY_UPDATED_AT:-}
  # AI Bình luận: quét bình luận mới mỗi 2 phút (off = chỉ dùng webhook), giãn cách trả lời trên cùng Fanpage
  POLL_COMMENTS: ${POLL_COMMENTS:-on}
  REPLY_MIN_GAP_MS: ${REPLY_MIN_GAP_MS:-6000}
  # Thông báo khách tiềm năng qua Telegram (có thể nhập trong trang Cài đặt thay vì ở đây)
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment: *app-env
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./server
    command: ["node", "queues/start.workers.js"]
    restart: unless-stopped
    environment: *app-env
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client

volumes:
  redis_data:
  server_data:
  server_uploads:
  caddy_data:
  caddy_config:

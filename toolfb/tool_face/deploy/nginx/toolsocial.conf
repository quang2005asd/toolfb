# Giai đoạn 2 (đã có chứng chỉ Let's Encrypt): HTTPS cho toolsocial.store → Docker toolsocial tại 127.0.0.1:3100
# Chỉ áp dụng cho tên miền toolsocial.store, không ảnh hưởng server block của site khác
server {
    listen 80;
    listen [::]:80;
    server_name toolsocial.store www.toolsocial.store;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://toolsocial.store$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.toolsocial.store;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/toolsocial.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolsocial.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://toolsocial.store$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name toolsocial.store;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/toolsocial.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolsocial.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Upload ảnh / video bài đăng (server cho phép tới 100 MB)
    client_max_body_size 110m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known).* {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # AI viết bài / tạo ảnh và upload video có thể mất vài phút
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}

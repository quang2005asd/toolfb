# Giai đoạn 1 (trước khi có chứng chỉ): chỉ HTTP cho toolsocial.store, để certbot xác minh qua /var/www/letsencrypt
# Đặt tại /etc/nginx/sites-available/toolsocial.conf + symlink sites-enabled; luôn `nginx -t` trước khi reload
server {
    listen 80;
    listen [::]:80;
    server_name toolsocial.store www.toolsocial.store;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300s;
    }
}

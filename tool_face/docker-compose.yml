version: '3.8'

services:
  # ========================================================
  # 1. REDIS SERVICE (Queue Engine cho BullMQ)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: tool-face-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tool-network

  # ========================================================
  # 2. BACKEND API SERVICE (Express + SQLite / MSSQL)
  # ========================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tool-face-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost:3000
      # Mặc định sử dụng SQLite độc lập zero-config; đổi sang mssql nếu muốn dùng SQL Server
      - USE_SQLITE=${USE_SQLITE:-true}
      - DB_TYPE=${DB_TYPE:-sqlite}
      # Cấu hình SQL Server (chỉ dùng khi USE_SQLITE=false)
      - DB_SERVER=${DB_SERVER:-localhost}
      - DB_NAME=${DB_NAME:-tool_face_db}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_PORT=${DB_PORT:-1433}
      - DB_ENCRYPT=${DB_ENCRYPT:-false}
      - DB_TRUST_CERT=${DB_TRUST_CERT:-true}
      # Kết nối Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Worker & Bảo mật
      - RUN_WORKER_IN_PROCESS=${RUN_WORKER_IN_PROCESS:-false}
      - SESSION_SECRET=${SESSION_SECRET:-toolfb_super_secure_jwt_secret_key_2025}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_REDIRECT_URI=${FACEBOOK_REDIRECT_URI:-http://localhost:5000/api/auth/facebook/callback}
      # Hộp thư Messenger + Instagram: chu kỳ tự đồng bộ (giây, 0 = tắt) và Verify Token cho webhook khi deploy có HTTPS
      - MESSENGER_SYNC_INTERVAL_SECONDS=${MESSENGER_SYNC_INTERVAL_SECONDS:-5}
      - MESSENGER_VERIFY_TOKEN=${MESSENGER_VERIFY_TOKEN:-}
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tool-network

  # ========================================================
  # 3. WORKER SERVICE (Background Queue Executor)
  # ========================================================
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tool-face-worker
    command: ["node", "queues/start.workers.js"]
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - USE_SQLITE=${USE_SQLITE:-true}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_SERVER=${DB_SERVER:-localhost}
      - DB_NAME=${DB_NAME:-tool_face_db}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - tool-network

  # ========================================================
  # 4. FRONTEND CLIENT SERVICE (Next.js via Nginx)
  # ========================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tool-face-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - server
    networks:
      - tool-network

# ========================================================
# PERSISTENT VOLUMES & NETWORKS
# ========================================================
volumes:
  redis_data:
    driver: local
  server_data:
    driver: local
  server_uploads:
    driver: local

networks:
  tool-network:
    driver: bridge

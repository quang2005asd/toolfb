version: '3.8'

services:
  # ========================================================
  # 1. REDIS SERVICE (Queue Engine cho BullMQ)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: tool-face-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tool-network

  # ========================================================
  # 2. BACKEND API SERVICE (Express + SQLite / MSSQL)
  # ========================================================
  server:
    build:
      context: ./tool_face/server
      dockerfile: Dockerfile
    container_name: tool-face-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost:3000
      - USE_SQLITE=${USE_SQLITE:-true}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_SERVER=${DB_SERVER:-localhost}
      - DB_NAME=${DB_NAME:-tool_face_db}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_PORT=${DB_PORT:-1433}
      - DB_ENCRYPT=${DB_ENCRYPT:-false}
      - DB_TRUST_CERT=${DB_TRUST_CERT:-true}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_WORKER_IN_PROCESS=${RUN_WORKER_IN_PROCESS:-false}
      - SESSION_SECRET=${SESSION_SECRET:-toolfb_super_secure_jwt_secret_key_2025}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_REDIRECT_URI=${FACEBOOK_REDIRECT_URI:-http://localhost:5000/api/auth/facebook/callback}
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tool-network

  # ========================================================
  # 3. WORKER SERVICE (Background Queue Executor)
  # ========================================================
  worker:
    build:
      context: ./tool_face/server
      dockerfile: Dockerfile
    container_name: tool-face-worker
    command: ["node", "queues/start.workers.js"]
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - USE_SQLITE=${USE_SQLITE:-true}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_SERVER=${DB_SERVER:-localhost}
      - DB_NAME=${DB_NAME:-tool_face_db}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - tool-network

  # ========================================================
  # 4. FRONTEND CLIENT SERVICE (Next.js via Nginx)
  # ========================================================
  client:
    build:
      context: ./tool_face/client
      dockerfile: Dockerfile
    container_name: tool-face-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - server
    networks:
      - tool-network

volumes:
  redis_data:
    driver: local
  server_data:
    driver: local
  server_uploads:
    driver: local

networks:
  tool-network:
    driver: bridge

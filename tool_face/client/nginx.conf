# Giữ nguyên giao thức gốc khi đứng sau Caddy (HTTPS) để server đặt cookie Secure đúng
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Chuyển hướng /privacy → /privacy/ bằng đường dẫn tương đối: đứng sau nginx / Caddy thì không lộ cổng nội bộ 3000
    absolute_redirect off;

    # Upload ảnh / video bài đăng (server cho phép tới 100 MB)
    client_max_body_size 110m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Client gọi API cùng domain qua /api → chuyển sang backend
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # AI viết bài / tạo ảnh và upload video có thể mất vài phút
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        # Backend tắt / đang khởi động lại → trả JSON để giao diện báo đúng lỗi
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        return 503 '{"success":false,"code":"server_down","message":"Máy chủ API đang tắt hoặc đang khởi động lại, vui lòng thử lại sau ít phút."}';
    }
}
